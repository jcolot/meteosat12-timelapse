name: youtube

# Upload a day's release videos to YouTube: the 60 s 16:9 video and the 15 s
# portrait one as a Short, described with the release notes. Called by the
# nightly run after the release; can also be run by hand for any released day.
# Secrets: YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN
# (see README). Repository variables: YOUTUBE_PRIVACY (default public),
# YOUTUBE_PLAYLIST (playlist ID for the videos), YOUTUBE_PLAYLIST_SHORTS
# (for the Shorts; default: YOUTUBE_PLAYLIST).
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Released day to upload, YYYY-MM-DD"
        required: true
      videos:
        description: "Instead of uploading: video IDs (space-separated) to add to the playlist below"
        required: false
      playlist:
        description: "With videos: playlist ID to add them to (default YOUTUBE_PLAYLIST)"
        required: false
      remove_from:
        description: "With videos: playlist ID to take them out of first"
        required: false
  workflow_call:
    inputs:
      date:
        type: string
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      DAY: ${{ inputs.date }}
      GH_TOKEN: ${{ github.token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Upload
        run: |
          if [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then echo "YouTube secrets not set: skipping"; exit 0; fi
          if [ -n "${{ inputs.videos }}" ]; then
            # shellcheck disable=SC2086
            if [ -n "${{ inputs.remove_from }}" ]; then
              uv run youtube.py playlist-remove "${{ inputs.remove_from }}" ${{ inputs.videos }}
            fi
            # shellcheck disable=SC2086
            uv run youtube.py playlist-add "${{ inputs.playlist || vars.YOUTUBE_PLAYLIST }}" ${{ inputs.videos }}
            exit
          fi
          gh release download "$DAY" --pattern '*.mp4' --dir videos
          when=$(date -u -d "$DAY" '+%-d %B %Y')
          # YouTube rejects < and > in descriptions; drop markdown marks
          { gh release view "$DAY" --json body --jq .body; echo
            echo "Videos and source: https://github.com/${{ github.repository }}/releases/tag/$DAY"; } \
            | sed 's/`//g; s/\*\*//g; s/[<>]//g' > yt.txt
          tags="Meteosat-12,MTG,EUMETSAT,Earth,timelapse,satellite,stars,space"
          privacy="${{ vars.YOUTUBE_PRIVACY || 'public' }}"
          pl="${{ vars.YOUTUBE_PLAYLIST }}"; pls="${{ vars.YOUTUBE_PLAYLIST_SHORTS || vars.YOUTUBE_PLAYLIST }}"
          uv run youtube.py upload "videos/earth_${DAY}_4k.mp4" --privacy "$privacy" ${pl:+--playlist "$pl"} \
            --title "Earth from Meteosat-12 with the real sky, $when (4K)" --description-file yt.txt --tags "$tags"
          uv run youtube.py upload "videos/earth_${DAY}_4k_15s_vertical.mp4" --privacy "$privacy" ${pls:+--playlist "$pls"} \
            --title "A day of Earth from space, $when #Shorts" --description-file yt.txt --tags "$tags"
